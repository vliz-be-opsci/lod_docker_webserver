  <h1>WRX Strategy 2 — HTTP Link Header DescribedBy</h1>
  <p>
    This HTML page is returned for any Accept header that is not a recognised RDF
    MIME type. The RDF metadata is discovered via the HTTP
    <code>Link: &lt;/wrx/s2/resource.ttl&gt;; rel="describedby"</code> response header
    that accompanies this page.
