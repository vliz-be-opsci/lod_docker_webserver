events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Increase bucket size to support long human-readable keys in maps
    map_hash_bucket_size 128;
    map_hash_max_size 4096;

    # Include content-negotiation maps generated dynamically for gapped instance
    include /usr/share/nginx/html/nginx-coneg.conf;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Enable Global CORS for LOD extraction utilities & web crawlers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Accept, Link" always;
        add_header Access-Control-Expose-Headers "Link, Content-Type, Location" always;

        # Gapped DOI Resolver: Redirects to HTML landing page
        location ~ ^/doi/ {
            if ($doi_payload_uri = "") {
                return 404;
            }
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Expose-Headers "Location" always;
            return 303 $scheme://$http_host$doi_payload_uri;
        }

        # GAP 1: arms-2018 is a Legacy Web Silo (serves plain HTML directly, bypassing 303 content negotiation)
        location = /id/dataset/arms-2018 {
            default_type text/html;
            try_files /id/dataset/arms-2018.html =404;
        }

        # Serve content-negotiated resource URIs for other resources (RFC 9110 / 303 See Other)
        # Matches /id/{type}/{name} without extension
        location ~ ^/id/(?<res_type>[^/]+)/(?<res_name>[^/.]+)$ {
            add_header Vary Accept always;
            add_header Access-Control-Allow-Origin * always;
            add_header Link '<$scheme://$http_host/id/$res_type/$res_name.linkset.json>; rel="linkset"; type="application/linkset+json"' always;
            return 303 $scheme://$http_host/id/$res_type/$res_name.$conneg_suffix;
        }

        # Serve all static files under /id/ with proper MIME types
        location /id/ {
            types {
                text/html                     html;
                text/turtle                   ttl;
                application/ld+json           jsonld;
                application/rdf+xml           rdf;
                application/linkset+json      json;
            }
        }

        # Serve DCAT catalogue
        location /catalog/ {
            types {
                text/html                     html;
                text/turtle                   ttl;
                application/ld+json           jsonld;
            }
        }

        # Serve API resources with JSON type
        location /api/ {
            default_type application/json;
        }

        # Serve Swagger documentation at /api/observations/v1/docs/
        location /api/observations/v1/docs/ {
            default_type text/html;
            try_files $uri $uri/ /api/observations/v1/docs/index.html =404;
        }

        # Serve Well-Known endpoints (RFC 9727 API Catalog)
        location /.well-known/ {
            types {
                application/linkset+json      api-catalog;
                application/json              json;
            }
        }

        # Include dynamically generated RFC 8288 Link headers from static builder
        include /usr/share/nginx/html/nginx-headers.conf;
    }
}
