events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    types {
        text/turtle                   ttl;
        application/ld+json           jsonld;
        application/rdf+xml           rdf;
    }

    # Increase bucket size to support long human-readable keys in maps
    map_hash_bucket_size 128;
    map_hash_max_size 4096;

    # Include content-negotiation maps generated dynamically
    include /usr/share/nginx/html/nginx-coneg.conf;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Enable Global CORS for LOD extraction utilities & web crawlers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Accept, Link" always;
        add_header Access-Control-Expose-Headers "Link, Content-Type, Location" always;

        # RT-P04 Local DOI Direct-to-Payload Resolver
        location ~ ^/doi/ {
            if ($doi_payload_uri = "") {
                return 404;
            }
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Expose-Headers "Location, Link" always;
            return 303 $scheme://$http_host$doi_payload_uri;
        }

        # Serve all static files under /id/ with proper MIME types
        location ~ ^/id/.*\.(html|ttl|jsonld|rdf|json)$ {
            types {
                text/html                     html;
                text/turtle                   ttl;
                application/ld+json           jsonld;
                application/rdf+xml           rdf;
                application/linkset+json      json;
            }
        }

        # RT-P09: Serve content-negotiated nested versioned URIs & history (/id/{type}/{name}/{sub})
        location ~ ^/id/(?<res_type>[^/]+)/(?<res_name>[^/]+)/(?<res_sub>[^/]+)$ {
            add_header Vary Accept always;
            add_header Access-Control-Allow-Origin * always;
            add_header Link '<$scheme://$http_host/id/$res_type/$res_name/$res_sub.linkset.json>; rel="linkset"; type="application/linkset+json"' always;
            return 303 $scheme://$http_host/id/$res_type/$res_name/$res_sub.$conneg_suffix;
        }

        # Serve content-negotiated resource URIs (RFC 9110 / 303 See Other)
        # Matches /id/{type}/{name} without extension
        location ~ ^/id/(?<res_type>[^/]+)/(?<res_name>[^/]+)$ {
            add_header Vary Accept always;
            add_header Access-Control-Allow-Origin * always;
            add_header Link '<$scheme://$http_host/id/$res_type/$res_name.linkset.json>; rel="linkset"; type="application/linkset+json"' always;
            return 303 $scheme://$http_host/id/$res_type/$res_name.$conneg_suffix;
        }

        # Fallback for other files under /id/
        location /id/ {
            types {
                text/html                     html;
                text/turtle                   ttl;
                application/ld+json           jsonld;
                application/rdf+xml           rdf;
                application/linkset+json      json;
            }
        }

        # Serve DCAT catalogue
        location /catalog/ {
            types {
                text/html                     html;
                text/turtle                   ttl;
                application/ld+json           jsonld;
            }
        }

        # Serve Swagger documentation at /api/observations/v1/docs/
        location /api/observations/v1/docs/ {
            default_type text/html;
            try_files $uri $uri/ /api/observations/v1/docs/index.html =404;
        }

        # Serve API resources with JSON type
        location /api/ {
            default_type application/json;
        }

        # Serve .well-known endpoints with linkset JSON MIME type
        location /.well-known/ {
            default_type application/linkset+json;
            types {
                application/linkset+json      api-catalog;
                application/linkset+json      json;
            }
        }

        # Serve downloadable data payloads with correct MIME types
        location /data/ {
            types {
                text/csv                      csv;
                application/geo+json          geojson;
                application/zip               zip;
                application/pdf               pdf;
                application/json              json;
            }
        }

        # Include dynamically generated per-resource Link headers (RFC 8288)
        include /usr/share/nginx/html/nginx-headers.conf;

        # Serve sitemaps with application/xml (RT-P06 & RT-P07)
        location ~* ^/sitemap.*\.xml$ {
            default_type application/xml;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
