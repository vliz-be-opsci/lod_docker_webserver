events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Enable Global CORS for LOD extraction utilities
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range, DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type";

        # Serve API resources with JSON type
        location /api/ {
            default_type application/json;
        }

        # Apply custom MIME types locally for RDF resource requests
        location /rdf/ {
            types {
                text/turtle                   ttl;
                application/ld+json           jsonld;
                application/rdf+xml           rdf;
            }
        }

        # Apply custom MIME types locally for manifest requests
        location /manifests/ {
            types {
                application/manifest+json     webmanifest;
            }
        }

        # Include dynamically generated per-page Link and pagination headers
        include /usr/share/nginx/html/nginx-headers.conf;

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
